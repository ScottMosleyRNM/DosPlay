<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DOS/PLAY">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="/DosPlay/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/DosPlay/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/DosPlay/favicon.png">
<title>DOS/PLAY</title>
<link rel="stylesheet" href="/DosPlay/js-dos.css">
<script src="/DosPlay/js-dos.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; }
body { background: #0f1117; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #e2e8f0; }

/* GAME AREA: fixed to top, ends exactly where controls begin */
#game-wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 307px; background: #000; }
#dos-root { width: 100%; height: 100%; position: relative; overflow: hidden; }
#dos-root > div { width: 100% !important; height: 100% !important; display: flex !important; align-items: flex-start !important; }
#dos-root canvas { width: 100% !important; height: auto !important; max-height: 100%; object-fit: contain; object-position: top center; image-rendering: pixelated; }
.jsdos-rso .sidebar, .jsdos-rso .sidebar-thin, .jsdos-rso .emulator-options { display: none !important; }

/* Launch / library screen */
#launch { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; background: #0f1117; padding: 28px 16px 16px; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#launch.hidden { display: none; }
#launch .hero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 18px; }
#launch h2 { font-size: 20px; }
#launch p  { color: #4a5568; font-size: 13px; text-align: center; }
.btn { padding: 12px 28px; background: #1a2035; border: 1px solid #2a3050; border-radius: 12px; color: #e2e8f0; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
.btn:active { background: #232d45; }
#err { color: #fc8181; font-size: 12px; text-align: center; display: none; margin-top: 10px; max-width: 360px; }
#err.show { display: block; }
#library { width: 100%; max-width: 420px; margin-top: 8px; }
#library h3 { font-size: 11px; letter-spacing: 1.5px; color: #4a5568; font-weight: 600; margin: 10px 4px 8px; }
.game { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; background: #141925; border: 1px solid #1e2433; border-radius: 12px; margin-bottom: 8px; }
.game .info { flex: 1; min-width: 0; }
.game .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game .sub  { font-size: 11px; color: #4a5568; margin-top: 3px; }
.game .sub.saved { color: #68d391; }
.sbtn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #2a3050; background: #1a2035; color: #e2e8f0; font-size: 12px; font-weight: 600; display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
.sbtn.primary { background: #1f3a2c; border-color: #2f6b4a; }
.sbtn.ghost { background: transparent; color: #4a5568; padding: 0 9px; }
.sbtn:active { filter: brightness(1.3); }
#backup { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; }
#backup .sbtn { background: transparent; color: #718096; }

/* CONTROLS: fixed to bottom, never moves */
#controls { position: fixed; bottom: 0; left: 0; right: 0; background: #0f1117; border-top: 1px solid #1e2433; }
#controls, #controls * { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#frow { height: 52px; display: flex; align-items: center; overflow: hidden; border-bottom: 1px solid #1e2433; }
#fscroll { display: flex; align-items: center; gap: 6px; padding: 0 12px; overflow-x: auto; height: 100%; scrollbar-width: none; }
#fscroll::-webkit-scrollbar { display: none; }
.fk { flex-shrink: 0; height: 36px; min-width: 44px; padding: 0 12px; background: #1a2035; border: 1px solid #1e2433; border-radius: 10px; color: #e2e8f0; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.fk.down, .fk:active { background: #232d45; }
#type-btn { gap: 5px; padding: 0 14px; }

#tabs { height: 44px; display: flex; align-items: center; padding: 0 12px; gap: 6px; border-bottom: 1px solid #1e2433; }
.tab { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent; color: #4a5568; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: center; line-height: 1; }
.tab:active { background: #232d45; color: #e2e8f0; }
#tab-menu { border-color: #2a3050; color: #e2e8f0; }
#tab-menu.on { background: #1a2035; border-color: #4a5568; }
.menu-item { display: none; }
#tabs.menu-open .menu-item { display: inline-flex; }
#tabs.menu-open:not(.multidisk) .disk-item { display: none; }
#app-version { margin-left: auto; color: #2a3050; font-size: 11px; padding-right: 4px; }
#tabs.menu-open #app-version { display: none; }

#dpad-wrap { height: 210px; display: flex; align-items: center; padding: 10px 12px 18px; gap: 10px; overflow: hidden; }
#dpad-wrap.hide { visibility: hidden; }
#action-col { display: flex; flex-direction: column; gap: 6px; width: 76px; flex-shrink: 0; }
.ab { height: 44px; background: #1a2035; border: 1px solid #1e2433; border-radius: 12px; color: #e2e8f0; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.ab.down { background: #232d45; }
#dpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px; flex: 1; height: 100%; }
.dp { background: #1a2035; border: 1px solid #1e2433; border-radius: 12px; color: #e2e8f0; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; min-width: 0; min-height: 0; }
.dp.down { background: #232d45; transform: scale(0.93); }
.dp-blank { background: transparent !important; border-color: transparent !important; }
.dp-mid   { background: #0f1117 !important; border-color: #0f1117 !important; color: #2a3050; font-size: 18px; }

#loading { display: none; position: fixed; inset: 0; background: rgba(15,17,23,0.92); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
#loading.show { display: flex; }
.spin { width: 36px; height: 36px; border: 3px solid #1e2433; border-top-color: #e2e8f0; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#ltxt { color: #4a5568; font-size: 12px; letter-spacing: 2px; }

#toast { position: fixed; bottom: 320px; left: 50%; transform: translateX(-50%) translateY(8px); background: #1a2035; border: 1px solid #2a3050; color: #e2e8f0; font-size: 13px; padding: 7px 18px; border-radius: 20px; opacity: 0; pointer-events: none; z-index: 1000; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.2s, transform 0.2s; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.bad { border-color: #9b2c2c; }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="dos-root"></div>
  <div id="launch">
    <div class="hero">
      <div style="font-size:44px">💾</div>
      <h2>DOS/PLAY</h2>
      <p>.zip folder · .img disk · .exe file</p>
      <div class="btn" id="launch-btn">⬆ Load Game</div>
      <div id="err"></div>
    </div>
    <div id="library"></div>
    <div id="backup">
      <div class="sbtn" id="export-btn">⬇ Back up saves</div>
      <div class="sbtn" id="import-btn">⬆ Restore backup</div>
    </div>
  </div>
</div>

<div id="controls">
  <div id="frow">
    <div id="fscroll">
      <div class="fk" id="type-btn">⌨ Type</div>
      <div class="fk" data-key="Escape">ESC</div>
      <div class="fk" data-key="F1">F1</div>
      <div class="fk" data-key="F2">F2</div>
      <div class="fk" data-key="F3">F3</div>
      <div class="fk" data-key="F4">F4</div>
      <div class="fk" data-key="F5">F5</div>
      <div class="fk" data-key="F6">F6</div>
      <div class="fk" data-key="F7">F7</div>
      <div class="fk" data-key="F8">F8</div>
      <div class="fk" data-key="F9">F9</div>
      <div class="fk" data-key="F10">F10</div>
    </div>
  </div>

  <div id="tabs">
    <div class="tab" id="tab-menu">☰ Menu</div>
    <div class="tab menu-item" data-action="save">💾 Save</div>
    <div class="tab menu-item" data-action="restore">↩ Restore</div>
    <div class="tab menu-item disk-item" data-action="disk">💽 Next disk</div>
    <div class="tab menu-item" data-action="eject">⏏ Eject</div>
    <div id="app-version"></div>
  </div>

  <div id="dpad-wrap">
    <div id="action-col">
      <div class="ab hold" data-key="Enter">ENTER</div>
      <div class="ab hold" data-key="Escape">ESC</div>
      <div class="ab hold" data-key=" ">SPACE</div>
      <div class="ab hold" data-key="Tab">TAB</div>
    </div>
    <div id="dpad-grid">
      <div class="dp dp-blank"></div>
      <div class="dp hold" data-key="ArrowUp">↑ Up</div>
      <div class="dp dp-blank"></div>
      <div class="dp hold" data-key="ArrowLeft">← Left</div>
      <div class="dp dp-mid">🎮</div>
      <div class="dp hold" data-key="ArrowRight">→ Right</div>
      <div class="dp dp-blank"></div>
      <div class="dp hold" data-key="ArrowDown">↓ Down</div>
      <div class="dp dp-blank"></div>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".zip,.img,.ima,.exe,.com,.bat,.jsdos" style="display:none">
<input type="file" id="import-input" accept=".dosplay,.json" style="display:none">
<div id="loading"><div class="spin"></div><div id="ltxt">LOADING</div></div>
<div id="toast"></div>

<script>
(() => { // own scope: js-dos.js declares many short global names ($, ci, p, …)
'use strict';
const APP_VERSION = '2.0.0';
const $ = id => document.getElementById(id);
$('app-version').textContent = 'v' + APP_VERSION;

// ═════════════════════════════════════════════════════════════
// UI helpers
// ═════════════════════════════════════════════════════════════
let toastTmr;
function toast(m, bad) {
  const t = $('toast'); t.textContent = m; t.classList.toggle('bad', !!bad); t.classList.add('show');
  clearTimeout(toastTmr); toastTmr = setTimeout(() => t.classList.remove('show'), bad ? 4500 : 2500);
}
function showLoad(t) { $('ltxt').textContent = t; $('loading').classList.add('show'); }
function hideLoad()  { $('loading').classList.remove('show'); }
function showErr(m)  { $('err').textContent = m; $('err').classList.add('show'); }
function hideErr()   { $('err').classList.remove('show'); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(fn, timeoutMs, everyMs = 200) {
  const end = Date.now() + timeoutMs;
  while (Date.now() < end) { if (await fn()) return true; await sleep(everyMs); }
  return false;
}
function fmtWhen(ts) {
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toDateString() === now.toDateString() ? 'today ' + time : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
}
function fmtSize(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }

// Prevent double-tap zoom on iOS
(() => { let last = 0; document.addEventListener('touchend', e => { const n = Date.now(); if (n - last < 350) e.preventDefault(); last = n; }, { passive: false }); })();

// ═════════════════════════════════════════════════════════════
// Storage (IndexedDB "dosplay2")
//   games: id → { id, name, bundle, size, addedAt, lastPlayed }
//   saves: gameId → { gameId, gameName, changes, savSize, createdAt }
//   prev:  gameId → previous good save (automatic backup)
// ═════════════════════════════════════════════════════════════
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('dosplay2', 1);
    r.onupgradeneeded = () => { const d = r.result; ['games', 'saves', 'prev'].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(stores, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(stores, mode); let out;
    Promise.resolve(fn(...[].concat(stores).map(s => t.objectStore(s)))).then(v => out = v, rej);
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Storage aborted'));
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbGet = (s, k) => tx(s, 'readonly', st => req(st.get(k)));
const dbAll = s => tx(s, 'readonly', st => req(st.getAll()));
const dbPut = (s, k, v) => tx(s, 'readwrite', st => { st.put(v, k); });
// Commit a new save atomically: current → prev, new → current
// (callback style on purpose: awaiting inside an IDB transaction is unsafe on older iOS)
const commitSave = rec => tx(['saves', 'prev'], 'readwrite', (saves, prev) => {
  const r = saves.get(rec.gameId);
  r.onsuccess = () => { if (r.result) prev.put(r.result, rec.gameId); saves.put(rec, rec.gameId); };
});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ═════════════════════════════════════════════════════════════
// ZIP helpers
// ═════════════════════════════════════════════════════════════
const enc = s => new TextEncoder().encode(s);
function crc32(d) { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) { c ^= d[i]; for (let j = 0; j < 8; j++) c = (c >>> 1) ^ (c & 1 ? 0xEDB88320 : 0); } return (c ^ 0xFFFFFFFF) >>> 0; }
function concat(arr) { const o = new Uint8Array(arr.reduce((s, a) => s + a.length, 0)); let i = 0; for (const a of arr) { o.set(a, i); i += a.length; } return o; }
function zipEntry(name, data, offset) {
  const nb = enc(name), crc = crc32(data), lh = new Uint8Array(30 + nb.length), v = new DataView(lh.buffer);
  v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true); v.setUint16(26, nb.length, true); lh.set(nb, 30);
  const cd = new Uint8Array(46 + nb.length), cv = new DataView(cd.buffer);
  cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, nb.length, true); cv.setUint32(42, offset, true); cd.set(nb, 46);
  return { lh, cd };
}
function eocdOf(zip) {
  const v = new DataView(zip.buffer, zip.byteOffset, zip.byteLength);
  for (let i = zip.length - 22; i >= Math.max(0, zip.length - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) return { v, at: i };
  throw new Error('Not a valid ZIP file');
}
// Central-directory listing (no decompression)
function zipList(zip) {
  const { v, at } = eocdOf(zip); const n = v.getUint16(at + 10, true); let p = v.getUint32(at + 16, true);
  const dec = new TextDecoder(), out = [];
  for (let i = 0; i < n; i++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP directory is damaged');
    const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true), usize = v.getUint32(p + 24, true);
    const nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    out.push({ name: dec.decode(zip.subarray(p + 46, p + 46 + nl)), method, csize, usize, lo });
    p += 46 + nl + xl + cl;
  }
  return out;
}
async function zipRead(zip, e) {
  const v = new DataView(zip.buffer, zip.byteOffset, zip.byteLength);
  const ds = e.lo + 30 + v.getUint16(e.lo + 26, true) + v.getUint16(e.lo + 28, true);
  const raw = zip.subarray(ds, ds + e.csize);
  let data;
  if (e.method === 0) data = raw.slice();
  else if (e.method === 8) data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  else throw new Error('Unsupported compression in ' + e.name);
  if (data.length !== e.usize) throw new Error('Corrupt entry ' + e.name);
  return data;
}
// Rebuild a ZIP keeping only entries where keep(name) is true.
// Compressed data is copied byte-for-byte, so this works for deflated archives too.
function zipFilter(zip, keep) {
  const src = new DataView(zip.buffer, zip.byteOffset, zip.byteLength);
  const { v, at } = eocdOf(zip); const n = v.getUint16(at + 10, true); let p = v.getUint32(at + 16, true);
  const dec = new TextDecoder(), parts = [], cds = []; let off = 0, count = 0;
  for (let i = 0; i < n; i++) {
    const nl = src.getUint16(p + 28, true), xl = src.getUint16(p + 30, true), cl = src.getUint16(p + 32, true);
    const name = dec.decode(zip.subarray(p + 46, p + 46 + nl));
    const cdLen = 46 + nl + xl + cl, cdRec = zip.slice(p, p + cdLen); p += cdLen;
    if (!keep(name)) continue;
    const cv = new DataView(cdRec.buffer);
    const lo = cv.getUint32(42, true), csize = cv.getUint32(20, true);
    const lnl = src.getUint16(lo + 26, true), lxl = src.getUint16(lo + 28, true);
    const lh = zip.slice(lo, lo + 30 + lnl + lxl), lv = new DataView(lh.buffer);
    // Write real sizes/CRC into the local header and drop the "data descriptor" flag
    lv.setUint16(6, lv.getUint16(6, true) & ~0x0008, true);
    lv.setUint32(14, cv.getUint32(16, true), true); lv.setUint32(18, csize, true); lv.setUint32(22, cv.getUint32(24, true), true);
    cv.setUint16(8, cv.getUint16(8, true) & ~0x0008, true);
    cv.setUint32(42, off, true);
    const data = zip.subarray(lo + 30 + lnl + lxl, lo + 30 + lnl + lxl + csize);
    parts.push(lh, data); cds.push(cdRec); off += lh.length + data.length; count++;
  }
  const cdB = concat(cds), e = new Uint8Array(22), ev = new DataView(e.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, count, true); ev.setUint16(10, count, true); ev.setUint32(12, cdB.length, true); ev.setUint32(16, off, true);
  return concat([...parts, cdB, e]);
}
async function unzipAll(zip) {
  const out = [];
  for (const e of zipList(zip)) if (!e.name.endsWith('/')) out.push({ name: e.name, data: await zipRead(zip, e) });
  return out;
}
function buildZip(files) {
  const parts = [], cds = []; let off = 0;
  for (const f of files) { const { lh, cd } = zipEntry(f.name, f.data, off); parts.push(lh, f.data); cds.push(cd); off += lh.length + f.data.length; }
  const cdB = concat(cds), e = new Uint8Array(22), ev = new DataView(e.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true); ev.setUint32(12, cdB.length, true); ev.setUint32(16, off, true);
  return concat([...parts, cdB, e]);
}
function appendToZip(zip, files) {
  const { v, at } = eocdOf(zip);
  const cnt = v.getUint16(at + 10, true), csz = v.getUint32(at + 12, true), coff = v.getUint32(at + 16, true);
  const parts = [], cds = []; let off = coff;
  for (const f of files) { const { lh, cd } = zipEntry(f.name, f.data, off); parts.push(lh, f.data); cds.push(cd); off += lh.length + f.data.length; }
  const ncd = concat(cds), e = new Uint8Array(22), ev = new DataView(e.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, cnt + files.length, true); ev.setUint16(10, cnt + files.length, true); ev.setUint32(12, csz + ncd.length, true); ev.setUint32(16, off, true);
  return concat([zip.subarray(0, coff), ...parts, zip.subarray(coff, coff + csz), ncd, e]);
}

// ═════════════════════════════════════════════════════════════
// Bundle builder: any game ZIP / IMG / EXE → js-dos bundle
// ═════════════════════════════════════════════════════════════
function dosConf(ae) {
  return `[sdl]\nautolock=false\n[dosbox]\nmachine=svga_s3\nmemsize=16\n[cpu]\ncore=auto\ncputype=auto\ncycles=auto\n[render]\nframeskip=0\naspect=false\nscaler=none\n[sblaster]\nsbtype=sb16\nsbbase=220\nirq=7\ndma=1\nhdma=5\noplmode=auto\noplrate=44100\n[mixer]\nnosound=false\nrate=44100\n${ae}`;
}
const q = p => /[\s()\[\]]/.test(p) ? '"' + p + '"' : p;
function pickExe(ns) {
  const base = n => n.split('/').pop().toLowerCase();
  const exclude = /setup|install|config|patch|update|uninst/i;
  const util = ['autoexec.bat', 'command.com', 'makepath.com', 'exists.com', 'godir.com', 'space.com', 'what.exe', 'moniter.com', '_pq.bat', 'cwsdpmi.exe', 'winsetup.exe', 'removespeech.exe'];
  const cand = ns.filter(n => !exclude.test(base(n)) && !util.includes(base(n)));
  const pool = cand.length ? cand : ns;

let dosInstance = null, CI = null, current = null; // current = { id, name }

async function stopEmu() {

// Start a game from the library. If restore=true, jump to its saved state.
async function launch(id, restore) {
  if (busy) return; busy = true;
  hideErr();
  try {
    showLoad('LOADING');
    const game = await dbGet('games', id);
    if (!game) throw new Error('Game not found in library');
    const save = restore ? await dbGet('saves', id) : null;
    if (restore && !save) throw new Error('No save for this game');
    let files = null;
    if (save) files = await unzipAll(save.changes); // fail early if the save is unreadable

    await stopEmu();
    $('launch').classList.add('hidden');
    showLoad(save ? 'RESTORING' : 'STARTING');
    frames = 0;
    const ready = new Promise((resolve, reject) => {
      const to = setTimeout(() => reject(new Error('Emulator did not start')), 60000);
      dosInstance = window.Dos($('dos-root'), {
        url: URL.createObjectURL(new Blob([game.bundle], { type: 'application/zip' })),
        pathPrefix: '/DosPlay/emulators/', backend: 'dosboxX', backendLocked: true,
        noCloud: true, noNetworking: true, workerThread: true, autoStart: true, kiosk: true,
        thinSidebar: true, renderAspect: '4/3',
        onEvent: (ev, ci) => {
          if (ev !== 'ci-ready') return;
          clearTimeout(to); CI = ci; bootAt = Date.now();
          try { ci.events().onFrame(() => { frames++; }); } catch (e) {}
          resolve(ci);
        },
      });
    });
    const ci = await ready;
    current = { id, name: game.name };
    $('tabs').classList.toggle('multidisk', (game.disks || 1) > 1);
    tx('games', 'readwrite', st => { game.lastPlayed = Date.now(); st.put(game, id); }).catch(() => {});

    if (save) {
      for (const f of files) await ci.fsWriteFile(f.name, f.data);
      // The machine must be fully running before a state can be loaded.
      // Too early crashes or silently garbles the screen, so wait for real frames.
      const ok = await waitFor(() => frames >= 12 && Date.now() - bootAt >= 2500, 45000, 100);
      if (!ok) throw new Error('Emulator too slow to restore — try again');
      ci.sendBackendEvent({ type: 'wc-trigger-event', event: 'hand_loadstate' });
      await sleep(600);
      toast('↩ Restored ' + fmtWhen(save.createdAt));
    } else {
      toast('▶ ' + game.name);
    }
  } catch (e) {
    console.error(e);
    await stopEmu();
    $('launch').classList.remove('hidden');
    showErr(e.message || String(e));
    renderLibrary();
  } finally { hideLoad(); busy = false; }
}

async function savSize() {
  const t = await CI.fsTree();
  const dir = (t.nodes || []).find(n => n.name === 'save');
  const f = dir && (dir.nodes || []).find(n => n.name === '1.sav');
  return f ? f.size : 0;
}

// Save full machine state: snapshot → verify → commit (old save kept as backup)

  if (!CI || !current) { toast('Start a game first'); return; }
  if (busy) return; busy = true;
  const ci = CI, game = current;
  showLoad('SAVING');
  try {
    if (await savSize() > 0) { try { await ci.fsDeleteFile('save/1.sav'); } catch (e) {} }
    ci.sendBackendEvent({ type: 'wc-trigger-event', event: 'hand_savestate' });
    // Wait until the state file exists and has stopped growing
    let last = -1, size = 0;
    const ok = await waitFor(async () => { size = await savSize(); const stable = size > 0 && size === last; last = size; return stable; }, 20000, 300);
    if (!ok) throw new Error('Emulator did not write a state file');
    const changes = await ci.persist(true); // only files that differ from the original game (incl. save/1.sav)
    if (!changes || !changes.length) throw new Error('Empty snapshot');
    const sav = zipList(changes).find(e => e.name === 'save/1.sav');
    if (!sav || sav.usize !== size) throw new Error('Snapshot did not include the state file');
    await zipRead(changes, sav); // proves it decompresses intact
    if (CI !== ci) throw new Error('Game changed during save');

  } catch (e) {
    console.error(e);
    toast('Save failed: ' + (e.message || e) + ' — previous save kept', true);
  } finally { hideLoad(); busy = false; }
}

// Restore the current game's last save without restarting
async function restoreState() {
  if (!CI || !current) { toast('Start a game first'); return; }
  if (busy) return;
  const save = await dbGet('saves', current.id);
  if (!save) { toast('No save yet for this game'); return; }
  if (!confirm('Restore save from ' + fmtWhen(save.createdAt) + '?\nProgress since then will be lost.')) return;
  busy = true; showLoad('RESTORING');
  try {
    const files = await unzipAll(save.changes);
    for (const f of files) await CI.fsWriteFile(f.name, f.data);
    CI.sendBackendEvent({ type: 'wc-trigger-event', event: 'hand_loadstate' });
    await sleep(600);
    toast('↩ Restored');
  } catch (e) { toast('Restore failed: ' + (e.message || e), true); }
  finally { hideLoad(); busy = false; }
}

    await renderLibrary();
  } finally { busy = false; }

async function addGameFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'rar' || ext === '7z') throw new Error('.' + ext + ' isn\'t supported. Extract it and re-zip the game folder.');
  if (!['zip', 'img', 'ima', 'exe', 'com', 'bat', 'jsdos'].includes(ext)) throw new Error('Unsupported file type: .' + ext);
  showLoad('READING FILE');
  const bytes = new Uint8Array(await file.arrayBuffer());
  const id = await hashId(bytes);
  const existing = await dbGet('games', id);
  if (existing) return id;
  showLoad('PREPARING');
  let bundle, disks = 1;
  if (ext === 'zip' || ext === 'jsdos') ({ bundle, disks } = await bundleFromZip(bytes));
  else if (/^(exe|com|bat)$/.test(ext)) bundle = bundleFromExe(bytes, file.name);
  else bundle = bundleFromFloppy(bytes);
  const name = file.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();
  await dbPut('games', id, { id, name, bundle, disks, size: bundle.length, addedAt: Date.now(), lastPlayed: 0 });
  return id;
}

let renderGen = 0;
async function renderLibrary() {
  const lib = $('library'), gen = ++renderGen;
  let games = [], saves = [];
  try { [games, saves] = await Promise.all([dbAll('games'), dbAll('saves')]); } catch (e) { lib.innerHTML = ''; return; }
  if (gen !== renderGen) return; // a newer render is in flight
  const saveBy = Object.fromEntries(saves.map(s => [s.gameId, s]));
  games.sort((a, b) => Math.max(b.lastPlayed, (saveBy[b.id] || {}).createdAt || 0) - Math.max(a.lastPlayed, (saveBy[a.id] || {}).createdAt || 0) || b.addedAt - a.addedAt);
  lib.innerHTML = '';
  $('backup').style.display = games.length || saves.length ? 'flex' : 'none';
  if (!games.length) return;
  const h = document.createElement('h3'); h.textContent = 'YOUR GAMES'; lib.appendChild(h);
  for (const g of games) {
    const s = saveBy[g.id];
    const row = document.createElement('div'); row.className = 'game';
    const info = document.createElement('div'); info.className = 'info';
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = g.name;
    const sub = document.createElement('div'); sub.className = 'sub' + (s ? ' saved' : '');
    sub.textContent = s ? 'Saved ' + fmtWhen(s.createdAt) : 'No save yet · ' + fmtSize(g.size);
    info.append(nm, sub); row.appendChild(info);
    const btn = (label, cls, fn) => { const b = document.createElement('div'); b.className = 'sbtn ' + cls; b.textContent = label; b.onclick = fn; row.appendChild(b); };
    if (s) btn('Continue', 'primary', () => launch(g.id, true));
    btn(s ? 'New' : 'Play', '', () => {
      if (s && !confirm('Start "' + g.name + '" from the beginning?\nYour save stays until you save again.')) return;
      launch(g.id, false);
    });
    btn('✕', 'ghost', async () => {
      if (!confirm('Remove "' + g.name + '" and its save from this device?')) return;
      await tx(['games', 'saves', 'prev'], 'readwrite', (a, b, c) => { a.delete(g.id); b.delete(g.id); c.delete(g.id); });

    });

  }

const KBD = { Enter: 257, Escape: 256, Tab: 258, Backspace: 259, Delete: 261, ' ': 32,

  F1: 290, F2: 291, F3: 292, F4: 293, F5: 294, F6: 295, F7: 296, F8: 297, F9: 298, F10: 299, F11: 300, F12: 301 };

const PUNCT = { '-': 45, '=': 61, '[': 91, ']': 93, '\\': 92, ';': 59, "'": 39, ',': 44, '.': 46, '/': 47, '`': 96 };
const SHIFTED = { '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7', '*': '8', '(': '9', ')': '0', '_': '-', '+': '=', '{': '[', '}': ']', '|': '\\', ':': ';', '"': "'", '<': ',', '>': '.', '?': '/', '~': '`' };

  else if (/[A-Z]/.test(ch)) { code = ch.charCodeAt(0); shift = true; }
  else if (/[0-9]/.test(ch)) code = ch.charCodeAt(0);

  el.addEventListener('pointerdown', e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {} held = true; el.classList.add('down'); keyEvt(code, true); });
